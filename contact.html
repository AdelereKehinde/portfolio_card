<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | HNG13 Frontend Stage 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="main-nav" data-testid="test-main-navigation">
      <ul>
        <li><a href="index.html" data-testid="test-nav-home">Home</a></li>
        <li><a href="about.html" data-testid="test-nav-about">About Me</a></li>
        <li><a href="contact.html" data-testid="test-nav-contact">Contact</a></li>
      </ul>
    </nav>

    <main class="contact-page">
      <header class="page-header">
        <h1>Get In Touch</h1>
        <p>I'd love to hear from you! Fill out the form below and I'll get back to you soon.</p>
      </header>

      <form id="contactForm" data-testid="test-contact-form" class="contact-form" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            data-testid="test-contact-name"
            required
            aria-describedby="nameError"
          >
          <span id="nameError" data-testid="test-contact-error-name" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            data-testid="test-contact-email"
            required
            aria-describedby="emailError"
          >
          <span id="emailError" data-testid="test-contact-error-email" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="subject">Subject *</label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            data-testid="test-contact-subject"
            required
            aria-describedby="subjectError"
          >
          <span id="subjectError" data-testid="test-contact-error-subject" class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea 
            id="message" 
            name="message" 
            rows="6" 
            data-testid="test-contact-message"
            required
            aria-describedby="messageError"
            minlength="10"
          ></textarea>
          <span id="messageError" data-testid="test-contact-error-message" class="error-message" aria-live="polite"></span>
        </div>

        <button 
          type="submit" 
          data-testid="test-contact-submit"
          class="submit-btn"
        >
          Send Message
        </button>

        <div 
          id="successMessage" 
          data-testid="test-contact-success" 
          class="success-message" 
          aria-live="polite"
          hidden
        >
          Thank you for your message! I'll get back to you soon.
        </div>
      </form>
    </main>

    <script src="contact.js"></script>
  </body>
</html>
